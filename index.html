<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://api.mapbox.com https://*.google.com https://*.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.mapbox.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.mapbox.com https://*.supabase.co https://*.googleapis.com https://*.gstatic.com https://images.unsplash.com; connect-src 'self' https://*.mapbox.com https://*.supabase.co wss://*.supabase.co https://*.googleapis.com; worker-src blob: 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"
    />

    <!-- Favicons + PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Canonical (per-page <link rel="canonical"> set via React Helmet) -->
    <link rel="canonical" href="https://liqzar.co.za/" />

    <!-- Google Search Console site verification -->
    <meta name="google-site-verification" content="qmf3Nm5LI1GYXf_eh9XDWRm7t-J65sgNVIglrYTk6yA" />

    <!-- Primary SEO meta -->
    <title>LIQZAR — Premium Liquor Delivery Johannesburg | 2-4 Hour Whisky, Wine & Champagne</title>
    <meta
      name="description"
      content="South Africa's premium liquor delivery service. Curated whisky, wine, champagne, and rare spirits delivered in 2-4 hours across Johannesburg & Gauteng. Discreet, secure, age-verified."
    />
    <meta
      name="keywords"
      content="liquor delivery Johannesburg, whisky delivery South Africa, premium spirits Sandton, wine delivery Gauteng, champagne delivery, rare whisky South Africa, LIQZAR, alcohol delivery 2 hours, premium liquor store online South Africa"
    />
    <meta name="author" content="LIQZAR" />
    <meta name="publisher" content="Akhanya IT" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="geo.region" content="ZA-GT" />
    <meta name="geo.placename" content="Johannesburg" />
    <meta name="ICBM" content="-26.2041, 28.0473" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:site_name" content="LIQZAR" />
    <meta property="og:title" content="LIQZAR — Premium Liquor Delivery in Johannesburg" />
    <meta
      property="og:description"
      content="Curated whisky, wine, champagne, and rare spirits delivered to your door in 2-4 hours. Premium. Discreet. South Africa."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://liqzar.co.za/" />
    <meta property="og:image" content="https://liqzar.co.za/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="LIQZAR — Premium liquor delivery across Johannesburg" />
    <meta property="og:locale" content="en_ZA" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@LIQZAR_ZA" />
    <meta name="twitter:title" content="LIQZAR — Premium Liquor Delivery in Johannesburg" />
    <meta name="twitter:description" content="Whisky. Wine. Champagne. Rare spirits. Delivered in 2-4 hours across Johannesburg." />
    <meta name="twitter:image" content="https://liqzar.co.za/og-image.jpg" />
    <meta name="twitter:image:alt" content="LIQZAR — Premium liquor delivery" />

    <!-- Performance: preconnect to critical third-party origins -->
    <link rel="preconnect" href="https://deiewcktyzzeviszukqj.supabase.co" />
    <link rel="dns-prefetch" href="https://deiewcktyzzeviszukqj.supabase.co" />
    <!-- Google Fonts: preconnect + parallel stylesheet load instead of the
         slow @import waterfall in src/index.css. The font-face arrives during
         first paint instead of after, so DM Sans/Outfit text renders without
         the "fallback → web font" swap that contributes to CLS. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&family=Outfit:wght@300;400;500;600;700;800&display=swap"
    />

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "LIQZAR",
        "url": "https://liqzar.co.za",
        "logo": "https://liqzar.co.za/liqzar-logo.png",
        "description": "Premium liquor delivery across Johannesburg and Gauteng. Curated whisky, wine, champagne, and rare spirits delivered in 2-4 hours.",
        "email": "support@liqzar.co.za",
        "sameAs": [
          "https://www.instagram.com/liqzar_za",
          "https://www.facebook.com/liqzar"
        ]
      }
    </script>

    <!-- JSON-LD: WebSite with SearchAction (enables Google sitelinks search box) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "LIQZAR",
        "url": "https://liqzar.co.za",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://liqzar.co.za/search?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- JSON-LD: LocalBusiness (Liquor Store category) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LiquorStore",
        "@id": "https://liqzar.co.za/#business",
        "name": "LIQZAR",
        "image": "https://liqzar.co.za/og-image.jpg",
        "url": "https://liqzar.co.za",
        "email": "support@liqzar.co.za",
        "priceRange": "R150 - R50000",
        "currenciesAccepted": "ZAR",
        "paymentAccepted": "Credit Card, Instant EFT, SnapScan, Cash on Delivery",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Johannesburg",
          "addressRegion": "Gauteng",
          "addressCountry": "ZA"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": -26.2041,
          "longitude": 28.0473
        },
        "areaServed": [
          { "@type": "City", "name": "Johannesburg" },
          { "@type": "City", "name": "Sandton" },
          { "@type": "City", "name": "Pretoria" },
          { "@type": "AdministrativeArea", "name": "Gauteng" }
        ],
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
            "opens": "10:00",
            "closes": "18:00"
          }
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
